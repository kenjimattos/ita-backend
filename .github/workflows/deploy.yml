name: Deploy ita-backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita dois deploys simultâneos; o mais novo espera o anterior terminar
concurrency:
  group: deploy-ita-backend
  cancel-in-progress: false

env:
  REGION: us-central1
  SERVICE: ita-backend

# Necessário para o token OIDC usado na autenticação
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # ID do projeto e conta de serviço ficam em secrets do environment
    # "production": o GitHub mascara os valores (***) nos logs.
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      RUNTIME_SA: ${{ secrets.GCP_RUNTIME_SA }}
      IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_AR_REPO }}/ita-backend

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: o GitHub apresenta um token OIDC do próprio
      # job e o Google o troca por credenciais de curta duração da conta de deploy.
      # Não há chave nem credencial pessoal guardada no GitHub.
      - name: Autenticar no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build da imagem (Cloud Build)
        run: gcloud builds submit --tag="$IMAGE:$GITHUB_SHA"

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE:$GITHUB_SHA" \
            --region="$REGION" \
            --allow-unauthenticated \
            --max-instances=5 \
            --service-account="$RUNTIME_SA" \
            --clear-secrets \
            --set-env-vars=GOOGLE_CLOUD_PROJECT="$PROJECT_ID"
